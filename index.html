<!doctype html>

<style>
  :root{
    --bg:#f7f9fc;
    --paper:#ffffff;
    --text:#172033;
    --muted:#7a8497;
    --panel:rgba(255,255,255,.94);
    --border:#e7ebf2;
    --shadow:0 14px 40px rgba(26,35,58,.10);
  }
  *{box-sizing:border-box}
  html,body{
    margin:0;height:100%;
    font-family:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, Helvetica, sans-serif;
    background:var(--bg);color:var(--text);overflow:hidden
  }
  #app{position:relative;width:100vw;height:100vh}
  #stage{width:100%;height:100%;cursor:grab}
  #stage.dragging{cursor:grabbing}
  .topbar{
    position:fixed;top:18px;left:18px;z-index:25;
    display:flex;align-items:center;gap:12px;
    background:var(--panel);border:1px solid var(--border);border-radius:18px;
    padding:10px 14px;box-shadow:var(--shadow);backdrop-filter:blur(12px)
  }
  .brand{display:flex;align-items:center;gap:10px}
  .brandmark{
    width:34px;height:34px;border-radius:11px;
    background:linear-gradient(135deg,#3E6BFF 0%,#9A73F8 48%,#FF5A91 100%);
    box-shadow:0 8px 18px rgba(90,105,255,.24)
  }
  .brandtext{line-height:1.05}
  .brandtext strong{display:block;font-size:13px;letter-spacing:.02em}
  .brandtext span{display:block;font-size:11px;color:var(--muted);margin-top:3px}

  .toolbar{
    position:fixed;right:18px;bottom:18px;z-index:20;display:flex;gap:7px;align-items:center;
    background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:7px 9px;
    box-shadow:var(--shadow);backdrop-filter:blur(12px)
  }
  .toolbar button{
    border:0;background:#f6f8fb;color:#2d3648;border-radius:10px;padding:9px 12px;
    cursor:pointer;font-weight:750;font-size:12px;transition:.18s ease
  }
  .toolbar button:hover{background:#eef2f8;transform:translateY(-1px)}
  .toolbar .zoom{
    min-width:58px;text-align:center;font-size:12px;font-weight:800;color:#465066;
    background:#fff;border:1px solid var(--border);border-radius:10px;padding:8px 9px
  }
  .hint{
    position:fixed;left:18px;bottom:18px;z-index:20;background:var(--panel);border:1px solid var(--border);
    border-radius:14px;padding:9px 12px;font-size:11px;color:#7a8497;box-shadow:var(--shadow);backdrop-filter:blur(12px)
  }
  svg{
    width:100%;height:100%;display:block;
    background:
      radial-gradient(circle at 1px 1px, rgba(27,39,65,.07) 1px, transparent 1.2px) 0 0/22px 22px,
      linear-gradient(#fafbfe,#f7f9fc);
  }
  .link{
    fill:none;stroke-width:2.25;stroke-linecap:round;
    opacity:.88;filter:drop-shadow(0 1px 0 rgba(255,255,255,.85))
  }
  .node text{
    font-size:13px;fill:#273248;dominant-baseline:middle;
    font-weight:520;letter-spacing:.002em
  }
  .node.root text{font-size:21px;font-weight:850;fill:#141c2c}
  .node.level1 text{font-weight:820;font-size:14px;fill:#1e293b}
  .node .toggle{cursor:pointer}
  .node .dot{fill:#fff;stroke-width:2.5}
  .node .check{rx:4;ry:4;filter:drop-shadow(0 2px 4px rgba(25,32,50,.10))}
  .node a text{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:2px}
  .node:hover text{fill:#111827}
  .node:hover .dot{filter:drop-shadow(0 0 5px rgba(72,93,255,.25))}
  .shadow{filter:drop-shadow(0 5px 12px rgba(28,37,56,.08))}
  .node-card{
    fill:rgba(255,255,255,.94);
    stroke:#e8ebf1;stroke-width:1;
    rx:10;ry:10;
    filter:drop-shadow(0 5px 12px rgba(28,37,56,.07))
  }
  .node-card.l1{
    fill:#fff;stroke-width:1.2;
    filter:drop-shadow(0 7px 16px rgba(28,37,56,.09))
  }
</style>
</head>

let id=0;
function prep(node, depth=0, inherited=null){
  node.id=++id; node.depth=depth;
  node.branchColor = depth===1 ? node.color : (inherited || node.color || C.cyan);
  (node.children||[]).forEach(c=>prep(c,depth+1,node.branchColor));
}
prep(data);

const svg=document.getElementById("stage");
const viewport=document.getElementById("viewport");
let scale=0.76, tx=180, ty=165;
let drag=false, sx=0, sy=0, stx=0, sty=0;

function visibleChildren(n){ return n._collapsed ? [] : (n.children||[]); }
function leafCount(n){
  const ch=visibleChildren(n);
  if(!ch.length) return 1;
  return ch.reduce((s,c)=>s+leafCount(c),0);
}
function layout(){
  const nodes=[], links=[];
  const rowH=42, colW=320;
  let yCounter=0;
  function walk(node, x){
    const ch=visibleChildren(node);
    let y;
    if(!ch.length){
      y=yCounter*rowH; yCounter++;
    } else {
      const childYs=ch.map(c=>walk(c,x+colW));
      y=(childYs[0]+childYs[childYs.length-1])/2;
    }
    node._x=x; node._y=y;
    nodes.push(node);
    ch.forEach(c=>links.push({s:node,t:c,color:c.branchColor}));
    return y;
  }
  walk(data,0);
  return {nodes,links};
}
function esc(s){return s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function render(){
  const {nodes,links}=layout();
  const xs=nodes.map(n=>n._x), ys=nodes.map(n=>n._y);
  const minY=Math.min(...ys), maxY=Math.max(...ys);
  let out='';
  links.forEach(l=>{
    const x1=l.s._x+12, y1=l.s._y, x2=l.t._x-12, y2=l.t._y;
    const mid=x1+(x2-x1)*.45;
    out += `<path class="link" stroke="${l.color}" d="M${x1},${y1} C${mid},${y1} ${mid},${y2} ${x2},${y2}"/>`;
  });
  nodes.forEach(node=>{
    const cls=node.depth===0?'root':node.depth===1?'level1':'';
    const c=node.branchColor || "#333";
    const has=(node.children||[]).length>0;
    const lines=node.text.split('\n');
    const textX=18;
    let tspan='';
    lines.forEach((ln,i)=>{
      const dy = i===0 ? (lines.length>1?-7:0) : 16;
      tspan += `<tspan x="${textX}" ${i===0?`dy="${dy}"`:`dy="16"`}>${esc(ln)}</tspan>`;
    });
    let prefix='';
    if(node.depth>1){
      prefix=`<rect class="check" x="-7" y="-7" width="14" height="14" fill="${c}" opacity=".95"/><path d="M-4,0 l3,3 5,-6" stroke="white" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`;
    }else if(node.depth===1){
      prefix=`<circle class="dot" cx="0" cy="0" r="6" stroke="${c}"/>`;
    }
    const toggle = has ? `<circle class="toggle dot" data-id="${node.id}" cx="-16" cy="0" r="6" stroke="${c}"/><path class="toggle" data-id="${node.id}" d="M-19,0 h6 ${node._collapsed?'M-16,-3 v6':''}" stroke="${c}" stroke-width="1.8" fill="none"/>` : '';
    let text = `<text x="${textX}" y="0">${tspan}</text>`;
    if(node.url) text=`<a href="${node.url}" target="_blank" rel="noopener">${text}</a>`;

    const maxLine = Math.max(...lines.map(s=>s.length));
    const approxW = Math.max(72, Math.min(430, maxLine * (node.depth===0 ? 11 : node.depth===1 ? 8.2 : 7.0) + 34));
    const cardH = Math.max(30, lines.length * 17 + 14);
    let card = "";
    if(node.depth===0){
      card = `<rect class="node-card l1" x="8" y="${-cardH/2}" width="${approxW}" height="${cardH}" rx="14" ry="14" stroke="${c}" stroke-opacity=".18"/>`;
    } else if(node.depth===1){
      card = `<rect class="node-card l1" x="8" y="${-cardH/2}" width="${approxW}" height="${cardH}" rx="11" ry="11" stroke="${c}" stroke-opacity=".22"/>`;
    } else if((node.children||[]).length>0){
      card = `<rect class="node-card" x="8" y="${-cardH/2}" width="${approxW}" height="${cardH}" rx="9" ry="9"/>`;
    }

    out += `<g class="node ${cls}" transform="translate(${node._x},${node._y})">${card}${toggle}${prefix}${text}</g>`;
  });
  viewport.innerHTML=out;
  viewport.setAttribute("transform",`translate(${tx},${ty}) scale(${scale})`);
  document.getElementById("zoomLabel").textContent=Math.round(scale*100)+"%";
  viewport.querySelectorAll(".toggle").forEach(el=>el.addEventListener("click",e=>{
    e.stopPropagation();
    const node=findById(data,+el.dataset.id);
    node._collapsed=!node._collapsed; render();
  }));
}
function findById(n,i){ if(n.id===i)return n; for(const c of n.children||[]){const r=findById(c,i); if(r)return r;} }
function setCollapsed(node, val, keepRoot=true){
  if(node.depth>0 || !keepRoot) node._collapsed=val;
  (node.children||[]).forEach(c=>setCollapsed(c,val,keepRoot));
}
function applyTransform(){ viewport.setAttribute("transform",`translate(${tx},${ty}) scale(${scale})`); document.getElementById("zoomLabel").textContent=Math.round(scale*100)+"%"; }
function fit(){
  setCollapsed(data,false);
  const {nodes}=layout();
  const maxX=Math.max(...nodes.map(n=>n._x))+450;
  const maxY=Math.max(...nodes.map(n=>n._y))+80;
  const minY=Math.min(...nodes.map(n=>n._y))-80;
  const vw=svg.clientWidth, vh=svg.clientHeight;
  const sx=(vw-80)/maxX, sy=(vh-80)/(maxY-minY);
  scale=Math.max(.18,Math.min(.85,Math.min(sx,sy)));
  tx=50; ty=40-minY*scale; applyTransform(); render();
}
svg.addEventListener("mousedown",e=>{drag=true;sx=e.clientX;sy=e.clientY;stx=tx;sty=ty;svg.classList.add("dragging")});
window.addEventListener("mouseup",()=>{drag=false;svg.classList.remove("dragging")});
window.addEventListener("mousemove",e=>{if(!drag)return;tx=stx+(e.clientX-sx);ty=sty+(e.clientY-sy);applyTransform()});
svg.addEventListener("wheel",e=>{
  e.preventDefault();
  const rect=svg.getBoundingClientRect(), mx=e.clientX-rect.left,my=e.clientY-rect.top;
  const old=scale, factor=e.deltaY<0?1.12:.89;
  scale=Math.max(.18,Math.min(2.5,scale*factor));
  tx=mx-(mx-tx)*(scale/old); ty=my-(my-ty)*(scale/old); applyTransform();
},{passive:false});

document.getElementById("plus").onclick=()=>{scale=Math.min(2.5,scale*1.15);applyTransform()};
document.getElementById("minus").onclick=()=>{scale=Math.max(.18,scale/1.15);applyTransform()};
document.getElementById("collapse").onclick=()=>{ (data.children||[]).forEach(x=>x._collapsed=true); render(); fitCollapsed(); };
document.getElementById("expand").onclick=()=>{ setCollapsed(data,false); render(); };
document.getElementById("fit").onclick=fit;
function fitCollapsed(){
  const {nodes}=layout(); const maxX=Math.max(...nodes.map(n=>n._x))+460, maxY=Math.max(...nodes.map(n=>n._y))+100;
  const minY=Math.min(...nodes.map(n=>n._y))-100, vw=svg.clientWidth,vh=svg.clientHeight;
  scale=Math.max(.25,Math.min(1.1,Math.min((vw-100)/maxX,(vh-80)/(maxY-minY))));
  tx=70; ty=40-minY*scale; applyTransform();
}
render();
setTimeout(fitCollapsed,50);
